# Rime schema
# encoding: utf-8

# 方案信息与开关
schema:
  schema_id: zamo_pro
  name: 雑䁿
  version: "LTS"
  author:
    - amzxyz
    - sk
  description: |
    雑䁿的主方案。使用小鹤双拼和直接辅助，支持整句输入与声调筛选。
  dependencies:
    - zamo_mixedcode # 中英混输
    - zamo_reverse # 拆分与笔画反查
    - zamo_english # 英文词库
    - zamo_chaifen # 候选拆分注释
    - moran_fixed
    - moran_charset # 字集过滤

# reset 指定默认状态，开关组从 0 开始计数。states 是方案选单中的名称。
switches:
  - name: ascii_mode
    states: [ 中文, 英文 ]
  - name: ascii_punct
    states: [ 中标, 英标 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: emoji
    states: [ 🙃, 😄 ]
    reset: 1
  - name: chinese_english
    states: [ 翻译关, 翻译开 ]
  - name: chaifen_switch # 候选注释优先显示拆分
    states: [ 拆分关, 拆分开 ]
  - name: extended_charset
    states: [ 通用, 增广 ]
  - name: pinyinhint
    states: [ 🔇, 🔊 ]
  - name: super_tips # 在输入栏显示提示
    states: [ 提示关, 提示开 ]
    reset: 0
  - name: prediction
    states: [ 预测关, 预测开 ]
  - options: [ raw_input, tone_display, full_pinyin, superscript_fuzhu ]
    states: [ 原编码, 有声调, 无声调, 角标辅 ]
  - options: [ comment_off, fuzhu_hint, tone_hint ]
    states: [ 注释关, 辅助开, 读音开 ]
  - name: traditionalization
    states: [ 简体, 繁體 ]
  - options: [ std_t, std_t2s, std_t2tw, std_t2hk, std_t2jp, std_t2dzing ]
    states: [ 通, 简, 台, 港, 日, 寍 ]
  - name: inflexible
    states: [ 動詞, 固詞 ]
  - name: char_priority # 反查时单字优先
    states: [ 词组先, 单字先 ]

# 输入引擎
# 各列表按顺序处理按键、分段、翻译和候选。
engine:
  processors:
    - lua_processor@*moran.moran_pin*pin_processor # PIN
    - lua_processor@*zamo.super_tips
    - lua_processor@*zamo.super_processor # 小键盘、快符、分词和声调处理
    - lua_processor@*moran.moran_processor
    - lua_processor@*zamo.force_upper_aux # 用大写辅助码固定当前候选
    - lua_processor@*mylua.partial_commit # 用 Ctrl+数字上屏句子前几个字
    - lua_processor@*mylua.reverse_comment
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@*zamo.key_binder # 按输入码匹配的扩展键绑定
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@zamo_reverse
    - punct_segmentor
    - fallback_segmentor # 在最后处理剩余段落
  translators:
    - punct_translator
    - table_translator@zamo_mixedcode #混合编码词汇表导入
    - lua_translator@*moran.moran_english*translator
    - lua_translator@*mylua.pseudo_moran@with_reorder # 合并固定、整句和动态词频候选
    - lua_translator@*mylua.mixed_V # 混合V
    - lua_translator@*zamo.unicode # 输入 U 加十六进制码位
    - table_translator@custom_phrase # 自定义短语
    - lua_translator@*moran.moran_pin*panacea_translator # PIN
    - reverse_lookup_translator@zamo_reverse # 拆分与笔画反查
  filters:
    - lua_filter@*moran.moran_charset_filter # 魔然字符集过滤
    - lua_filter@*moran.moran_pin*pin_filter # PIN
    - lua_filter@*moran.moran_reorder_filter # 魔然滤镜
    - lua_filter@*moran.moran_ijrq_filter # 魔然出简让全
    - lua_filter@*mylua.super_comment_preedit # 处理候选注释和输入栏显示
    - lua_filter@*moran.moran_hint_filter # 魔然简词提示
    - lua_filter@*moran.moran_english*add_word_filter # 魔然英文造词
    - lua_filter@*moran.moran_english*capitalizer_filter
    - simplifier@emoji # emoji表情切换
    - simplifier@traditionalize # 简繁切换
    - simplifier@std_t2s
    - simplifier@std_t2tw
    - simplifier@std_t2hk
    # - simplifier@std_t2jp
    # - simplifier@std_t2dzing
    - simplifier@chinese_english # 中英翻译切换
    - simplifier@pinyinhint # 汉字拼音提示切换
    - lua_filter@*zamo.super_filter
    - lua_filter@*mylua.aux_code
    - lua_filter@*mylua.super_lookup # 组字过程中反查筛选
    - uniquifier

# 拼写与按键
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA1234567890`;/\@|
  # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/
  delimiter: " '" # 空格为分隔符，单引号可手动分词
  visual_delimiter: " " # 输入栏显示的分隔符
  algebra:
    __patch:
      - zamo_algebra:/pro/小鹤双拼
      - zamo_algebra:/pro/直接辅助
  auto_select: true
  auto_select_pattern: ^(\w+)/

recognizer:
  import_preset: default # 从 default.yaml 继承通用的
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]+)$" # 斜杠符号表
    zamo_reverse: "^`[A-Za-z]*$" # 与 zamo_reverse/prefix 对应
    mixed_V: "^V.*$" # 混合V
    date_offset: "^rq[+-][0-9]*$" # 日期偏移
    unicode: "^U[a-f0-9]+" # Unicode 码位
    number: "^R[0-9]+[.]?[0-9]*" # 数字与金额
    sjc: "^[/o]rc\\d+[-+=op]?$"
    yr1: "^N0[1-9]?0?[1-9]?"
    yr2: "^N1[02]?0?[1-9]?"
    yr3: "^N0[1-9]?[1-2]?[1-9]?"
    yr4: "^N1[02]?[1-2]?[1-9]?"
    yr5: "^N0[1-9]?3?[01]?"
    yr6: "^N1[02]?3?[01]?"
    nyr1: "^N19?[0-9]?[0-9]?[0-1]?[0-9]?[0-9]?[0-9]?"
    nyr2: "^N20?[0-9]?[0-9]?[0-1]?[0-9]?[0-9]?[0-9]?"
    calculator: "^V.*$" #计算器功能引导
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$" # URL
    english: '(^[A-Za-z]{4}[A-Za-z]*)|(^[A-Z][A-Za-z]*)|(^[a-z][A-Z][a-zA-Z]*)|(^[a-z][a-z][A-Z][a-zA-Z]*)'

key_binder:
  import_preset: default # 从 default.yaml 继承通用的
  select_first_character: "bracketleft" # 左中括号 [
  select_last_character: "bracketright" # 右中括号 ]
  sequence:
    # 候选手动排序
    up: "Control+j" # 上移
    down: "Control+k" # 下移
    reset: "Control+l" # 重置
    pin: "Control+p" # 置顶
  shijian_keys: [ "/", "o" ]
  tips_key: "comma" # 提示上屏键
  bindings:
    - { when: composing, accept: "Control+e", toggle: chinese_english }
    - { when: composing, accept: "Control+m", toggle: chaifen_switch }
    - { when: composing, accept: "Control+Q", toggle: moqi_ultra_all }
    - { when: composing, accept: "Control+a", toggle: fuzhu_hint }
    - { when: composing, accept: "Control+s", toggle: tone_display }
    - { when: composing, accept: "Control+T", toggle: super_tips }
    - { when: composing, accept: "Control+g", toggle: extended_charset }
    - { when: has_menu, accept: "Tab", send: "Control+Right" }
    - { when: composing, accept: "Tab", send: "Control+Right" }
    - { when: composing, accept: "Control+N", toggle: emoji }
    - { when: composing, accept: "Control+S", toggle: full_shape }
    - { when: composing, accept: "Control+A", toggle: ascii_punct }
    - { when: composing, accept: "Control+P", toggle: prediction }
    - { when: composing, accept: "Control+C", toggle: pinyinhint }
    - { when: composing, accept: "Control+u", toggle: unicode_comment }
    - { when: has_menu, accept: "Tab", send: "Control+Right" }
    - { when: composing, accept: "Tab", send: "Control+Right" }
    - { match: "[a-z]{1,4}", accept: ":", send_sequence: "/1" }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: composing, accept: Alt+Left, send: Shift+Left }
    - { when: composing, accept: Alt+Right, send: Shift+Right }
    - { when: always, toggle: ascii_punct, accept: Control+Shift+numbersign } # 切换中英标点
    - { when: always, toggle: std_opencc, accept: Control+Shift+dollar } # 切换简繁
    - { when: always, accept: Shift+space, select: .next } #下一个方案
    - { match: "^›+$", accept: "backslash", send_sequence: '{Clear}{backslash}' }
    - { match: "^›+$", accept: "comma", send_sequence: '{Clear}{comma}' }
    - { match: "^›+$", accept: "period", send_sequence: '{Clear}{period}' }
    - { match: "^›+$", accept: "Return", send_sequence: '{Clear}{Return}' }

editor:
  bindings:
    space: confirm # 空格键：上屏候选项
    Return: commit_raw_input # 回车键：上屏原始输入
    Control+Return: commit_script_text # Ctrl+回车键：上屏变换后输入（经过 preedit转换的）
    Control+Shift+Return: commit_comment # Ctrl+Shift+回车键：上屏 comment
    BackSpace: revert # 退格键：向前删除（撤消上次输入）
    Delete: delete # Delete 键：向后删除
    Control+BackSpace: back_syllable # Ctrl+退格键：删除一个音节
    Control+Delete: delete_candidate # Ctrl+Delete键：删除或降权候选项
    Escape: cancel # Esc 键：取消输入

navigator:
  bindings:
    Left: left_by_char_no_loop
    Right: right_by_char_no_loop
    Shift+Left: left_by_syllable
    Shift+Right: right_by_syllable

kp_number_mode: auto

super_processor:
  enable_backspace_limit: true # 开启/关闭退格限制
  enable_seg_loop: true # 开启/关闭分词符（'）循环
  enable_tone_fallback: true # 启用声调回退
  enable_predict_space: false # 空格打断联想
  kp_number_mode: auto # 小键盘模式 (auto / compose / select)
  limit_repeated: "8,40" #格式："最大重复声母数,最大候选字数"
  select_character: "[,]" # 开启以词定字，自动拆解第一位上屏首字，第二位上屏尾字
  # 也可写成 "bracketleft, bracketright"。

force_upper_aux:
  hotkey: "period" # 固定当前候选的按键
  symbol: "›" # 输入栏中大写辅助码的占位符

# 词库与候选排序
# 整句翻译
translator:
  dictionary: zamo_pro
  prism: zaran # 拼写索引名称
  enable_completion: true # 启用候选词补全
  enable_user_dict: false # 动态词频由 frequency 处理
  contextual_suggestions: false
  max_homophones: 5
  max_homographs: 7
  core_word_length: 4 # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7 # >0 启用，过长短语不记整词，只加元素权重
  enable_correction: false #是否开启自动纠错
  initial_quality: 5 # 初始质量拼音的权重应该比英文大
  spelling_hints: 50 # 把原始词典注释交给 super_comment_preedit
  always_show_comments: true
  comment_format: { comment }

grammar:
  language: zamo-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

# 动态词频
frequency:
  dictionary: zamo_pro
  prism: zaran
  initial_quality: 5 # 初始权重
  spelling_hints: 20
  contextual_suggestions: false # 语言模型预测词组权重
  core_word_length: 4 # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7 # >0 启用，过长短语不记整词，只加元素权重
  enable_completion: true # 补全提示
  max_homographs: 5 # 最大同形簇长度
  max_homophones: 10 # 最大同音簇长度
  max_sentences: 2

# 固定字词
fixed:
  dictionary: moran_fixed_simp
  enable_charset_filter: false
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
  enable_encoder: true
  encode_commit_history: true # 是否開啓自動造詞
  initial_quality: 1000

# 自定义短语
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase # 需要手动创建 custom_phrase.txt 文件
  db_class: stabledb
  enable_completion: false # 补全提示
  enable_sentence: false # 禁止造句
  initial_quality: 99999 # custom_phrase 的权重高于拼音和英文候选

# moran_english.lua 通过 table_translator@english 读取此节点。
english:
  dictionary: zamo_english
  tag: english
  user_dict: en
  enable_completion: true
  enable_sentence: false
  initial_quality: 2.1
  comment_format:
    - xform/^~.+$//

english_add_word:
  dictionary: zamo_english
  enable_user_dict: false

zamo_mixedcode:
  dictionary: zamo_mixedcode
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 2
  comment_format:
    - xform/^~.+$//

moran:
  quick_code_indicator: "⚡"
  enable_quick_code_hint: true
  quick_code_hint_skip_chars: false
  inject_fixed_chars: true # 合并固定码表中的单字
  inject_fixed_words: true # 合并固定码表中的词语

  # 出简让全
  ijrq:
    enable: true
    defer: 2 # 让全单字排在前两个常规候选之后
    show_hint: true # 后移时提示简码
    enable_word: true
    enable_word_defer: 3
    enable_word_delay: 250 # 补码间隔达到此毫秒数后触发词语重排

  # PIN 置顶与按编码加词
  pin:
    enable: true
    indicator: ""
    panacea:
      prompt: "〔首选·加词〕"
      infix: "//" # 新编码 // 已有码
      freestyle: true # 新编码 // 加空格进入自由加词

  charset: simp # simp 简体，trad 繁体，both 两者都显示
  shorthands: false # 略码造词
  disable_sentence_candidates_upto: 1 # 至少输入两码才生成整句候选
  english:
    add_word:
      enable: true
      indicator: "「Add words」"
      trigger: "``"

# 成语简码在第一页的位置，0 关闭前置。
idiom_preposition: 2

# 反查、辅助码与候选注释
zamo_reverse:
  tag: zamo_reverse
  dictionary: zamo_reverse
  prefix: "`" # 反查前缀（反查时前缀会消失），与 recognizer/patterns/zamo_reverse 匹配
  tips: "〔反查：拆分|笔画〕"
  enable_completion: true

zamo_lookup:
  tags: [ abc, add_user_dict ]
  key: "`" # 组字中的反查触发键，须包含在 speller/alphabet 中
  lookup: [ zamo_reverse ]
  enable_tone: true # 支持按声调筛选
  data_source: [ 'aux', 'db' ] # 顺序决定优先级，aux 取词典注释，db 查反查词库

aux_code:
  storage: "db" # db 使用数据库，text 读取文本
  trigger_word: "@" # 临时辅助码触发键
  show_aux_notice: "trigger" # always 始终显示，trigger 触发后显示，none 隐藏

super_comment:
  candidate_length: 2 # 提示辅助码的候选长度上限，0 关闭
  corrector_type: "〔comment〕" # 候选纠错注释的格式
  fuzhu_type: fuzhu

# 输入栏中的声调显示
tone_preedit:
  "7": "¹"
  "8": "²"
  "9": "³"
  "0": "⁴"

super_tips:
  db_name: "tips"
  tips_key: "comma" # 提示上屏键
  files:
    - lua/data/tips_show.txt # 内置提示数据
    - lua/data/tips_user.txt # 自定义提示数据
  disabled_types:
    - "禁用类型A"
    - "禁用类型B"

# 字符转换与提示
emoji:
  option_name: emoji # 对应 switches 中的 name
  opencc_config: emoji.json # 选择要加载的 OpenCC 配置
  inherit_comment: true

# 简繁切换
traditionalize:
  option_name: traditionalization
  # opencc_config: s2t.json   # s2t.json | s2hk.json | s2tw.json | s2twp.json
  opencc_config: s2t.json
  tips: char # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
  tags: [ abc ] # 限制在对应 tag，不对其他如反查的内容做简繁转换

std_t2s:
  opencc_config: moran_t2s.json
  option_name: std_t2s
  tags: [ abc, number ]

std_t2hk:
  opencc_config: t2hk.json
  option_name: std_t2hk
  #tips: all
  tags: [ abc, number ]

std_t2tw:
  opencc_config: t2tw.json
  option_name: std_t2tw
  #tips: all
  tags: [ abc, number ]

std_t2jp:
  opencc_config: t2jp.json
  option_name: std_t2jp
  tips: all
  tags: [ abc, number ]

std_t2dzing:
  opencc_config: moran_t2dzing.json
  option_name: std_t2dzing
  tips: all
  tags: [ abc, number ]

chinese_english:
  option_name: chinese_english
  opencc_config: chinese_english.json
  tips: char
  comment_format:
    - "xform/-/ /"

pinyinhint:
  option_name: pinyinhint
  opencc_config: moran_pinyinhint.json
  tips: char
  show_in_comment: true

# 标点与符号
punctuator:
  digit_separators: ":,." # 数字分隔符
  __include: zamo_symbols:/symbol_table

paired_symbols:
  __include: zamo_symbols:/paired_symbols

paired_punct:
  __include: zamo_symbols:/paired_punct

quick_symbol_text:
  __include: zamo_symbols:/quick_symbol_text

# 工具格式与联想
calculator:
  trigger: "V"

# 日期和时间模板
# 日期使用 Y/y（四位/两位年）、m/n（月）、d/j（日）。
# 时间使用 H/G（24 小时）、I/l（12 小时）、M（分）、S（秒）、p/P（am/pm）。
# m、d、H、I 有前导零。A 为中文时段，O/o 为带或不带冒号的时区。
# 反斜杠转义单个字符，[[...]] 保留整段字面量。
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - "Y.m.d"
  - "Ymd"
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"

time_formats:
  - "H:M"
  - "H点M分"
  - "H:M:S"
  - "H时M分S秒"
  - "AI:M"
  - "I:M P"

datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - "YmdHMS"
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"

input_stats:
  db_name: "stats" # 自定义统计数据库路径
  triggers:
    clear: "/qctj" # 清除数据（推荐长一点防误触）
    today: "/rtj" # 查今日（日统计）
    week: "/ztj" # 查本周（周统计）
    month: "/ytj" # 查本月（月统计）
    year: "/ntj" # 查本年（年统计）
    total: "/tj" # 查生涯（总统计）
    history: "/htj" # 时光机：查历史。用法示例输入：/htj20231015，从年月日依次递进，以t间隔查区间/htj20231015t20240102

user_predict:
  db_name: predict # 数据库名称（默认 predict，将生成 predict.userdb 文件夹）
  mobile_predict_style: post # 移动端联想模式："post"（上屏后弹出预测候选）| "reorder"（输入时调频）| "off"（关闭）
  # 上面的开关是总开关，开启后pc端自动为上下文调频模式，不再有弹出模式。
  enable_fallback_reorder: false # 同码回删再输首次交换
  max_candidates: 10 # 屏幕最多显示的联想词数量
  max_predictions: 3 # 连续触发预测的最高次数限制
  expiry_days: 90 # 绝对寿命（天）：不命中则物理销毁
  activation_days: 7 # 激活期限（天）：冷冻期内输入第2次转正
  max_memory_branches: 15 # 分支上限：单前缀最多保留15个后续预测
  decay_rate: 0.85 # 衰减率：单日时间权重打 85 折
  context_timeout: 5000 # 上文超时时间毫秒
  custom_classifiers:
    # 数字后量词调频，如平时chuan传，输入数字后，首选为串，结果如：1串，想关闭清空列表即可
    - 个只名位口人头匹条群批伙多 # 人物动物
