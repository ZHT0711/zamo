    - 双对副套打串束排阵堆叠摞扎 # 成组集合
    - 杯瓶盒包份碗锅盆桶袋罐盘 # 包装容器
    - 次场局回趟顿番遍声项宗桩款步招 # 动作事件
    - 年月天周岁秒分刻代期届任夜季 # 时间周期
    - 本册篇首句段卷幅节堂门帖字行 # 文化作品
