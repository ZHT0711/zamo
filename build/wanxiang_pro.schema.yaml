add_user_dict:
  dictionary: wanxiang_pro
  enable_auto_phrase: false
  enable_completion: true
  enable_user_dict: true
  initial_quality: "-1"
  prefix: "``"
  spelling_hints: 50
  tag: add_user_dict
  tips: "〔开始造词〕"
  user_dict: zc
aux_code:
  show_aux_notice: trigger
  storage: db
  trigger_word: "@"
calculator:
  trigger: V
chinese_english:
  comment_format:
    - "xform/-/ /"
  opencc_config: chinese_english.json
  option_name: chinese_english
  tips: char
custom_phrase:
  db_class: stabledb
  dictionary: ""
  enable_completion: false
  enable_sentence: false
  initial_quality: 99999
  user_dict: custom_phrase
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - Y.m.d
  - Ymd
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"
datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - YmdHMS
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"
editor:
  bindings:
    BackSpace: revert
    "Control+BackSpace": back_syllable
    "Control+Delete": delete_candidate
    "Control+Return": commit_script_text
    "Control+Shift+Return": commit_comment
    Delete: delete
    Escape: cancel
    Return: commit_raw_input
    space: confirm
emoji:
  inherit_comment: true
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "lua_filter@*wanxiang.user_predict*F"
