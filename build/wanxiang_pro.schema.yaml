    - "simplifier@traditionalize"
    - "simplifier@std_hk"
    - "simplifier@std_tw"
    - "simplifier@chinese_english"
    - "lua_filter@*wanxiang.super_filter"
    - "lua_filter@*aux_code"
    - "lua_filter@*wanxiang.super_lookup"
