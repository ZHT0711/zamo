# Rime schema settings
# encoding: utf-8
schema:
  schema_id: zamo_reverse
  name: "雑䁿：拆分与笔画反查"
  version: "LTS"
  author: amzxyz
  description: |
    雑䁿的反查功能模块，支持部件组字与笔画反查。
engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?


speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"
  algebra:
    __include: zamo_algebra:/reverse/小鹤双拼
    __patch: zamo_algebra:/reverse/hspzn # 横竖撇折捺笔画编码

translator:
  dictionary: zamo_reverse
  enable_user_dict: false