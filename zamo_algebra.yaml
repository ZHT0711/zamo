    - derive/1/'yī'/
    - derive/2/'èr'/
    - derive/3/'sān'/
    - derive/4/'sì'/
    - derive/5/'wǔ'/
    - derive/6/'liù'/
    - derive/7/'qī'/
    - derive/8/'bā'/
    - derive/9/'jiǔ'/
    # 符号派生，将编码中的符号，该消失的消失，该转换为名称的转换为名称
    - derive/\+/'plus'/
    - derive/\./'dot'/
    - derive/@/'at'/
    - derive/-/'hyphen'/
    - derive/#/'hash'/
    - derive/#/'number'/
    - derive/#/'sharp'/
    - derive/♯/'sharp'/
    - derive / 'slash'
    - derive/&/'and'/
    - derive/%/'percent'/
    # 派生单个特殊字符需要消失的转换为'分隔符，需要转换为拼音的放在具体的输入布局转写中
    - derive/--/'jiǎn'jiǎn'/   #两个连续减号转换为jiǎn'jiǎn
    - derive/^(.*)-$/$1'jiǎn/      #单个减号末尾的转换为jiǎn
    - derive/-/'/                  #中间减号一般无意义，转换为分隔符以忽略
    - derive/_/'/
    - derive/\./'diǎn'/
    - derive/\+/'jiā'/
    - derive/·/'/
    - derive/#/'jǐng'/
    - derive/[@]/'ài'tè'/
    - derive/[@]/'quān'a'/
    - xform/'+/'/
    - xform/^'(.*)$/$1/
    - xform/^(.*)'$/$1/
    - derive/^.+$/\U$0/

