      - xform/i?ong(\d)(;.*)/Ⓢ$1$2/
      - xform/ing(\d)(;.*)/Ⓚ$1$2/
      - xform/uai(\d)(;.*)/Ⓚ$1$2/
      - xform/eng(\d)(;.*)/Ⓖ$1$2/
      - xform/[iu]ang(\d)(;.*)/Ⓛ$1$2/
      - xform/ang(\d)(;.*)/Ⓗ$1$2/
      - xform/ian(\d)(;.*)/Ⓜ$1$2/
      - xform/iao(\d)(;.*)/Ⓝ$1$2/
      - xform/[iu]a(\d)(;.*)/Ⓧ$1$2/
      - xform/ui(\d)(;.*)/Ⓥ$1$2/
      - xform/in(\d)(;.*)/Ⓑ$1$2/
