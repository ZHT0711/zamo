      - xform/^(.*)ǐ(.*)(;.*)$/$1i$2③$3/
      - xform/^(.*)ì(.*)(;.*)$/$1i$2④$3/
      - xform/^(.*)ū(.*)(;.*)$/$1u$2①$3/
      - xform/^(.*)ú(.*)(;.*)$/$1u$2②$3/
      - xform/^(.*)ǔ(.*)(;.*)$/$1u$2③$3/
      - xform/^(.*)ù(.*)(;.*)$/$1u$2④$3/
      - xform/^(.*)ǖ(.*)(;.*)$/$1v$2①$3/
      - xform/^(.*)ǘ(.*)(;.*)$/$1v$2②$3/
      - xform/^(.*)ǚ(.*)(;.*)$/$1v$2③$3/
      - xform/^(.*)ǜ(.*)(;.*)$/$1v$2④$3/
      - xform/^(.*)ü(.*)$/$1v$2/
      - xform/^(.*)ń(.*)(;.*)$/$1n$2②$3/
      - xform/^(.*)ň(.*)(;.*)$/$1n$2③$3/
      - xform/^(.*)ǹ(.*)(;.*)$/$1n$2④$3/
      - xform/^(.*)ḿ(.*)(;.*)$/$1m$2②$3/
      - xform/^(.*)m̀(.*)(;.*)$/$1m$2④$3/
      - xlit/①②③④/7890
      - derive/^ng(\d)(;.*)$/eng$1$2/
      - xform/^n(\d)(;.*)/en$1$2/
      - xform/^m(\d)(;.*)/me$1$2/
