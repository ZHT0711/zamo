  直接辅助:
    __append:
  #以下是双拼运算
      - derive/^(.*?)(\d?);.*$/$1/ # 纯双拼的情况
  #分号后面第一组辅助码
      - derive/^(.*?)(\d?);.*$/$1$2/        # 双拼+声调的情况
      - derive/^(.*?)(\d?);(\w).*$/$1$3/        # 双拼+一位辅助码的情况
      - derive|^(.*?)(\d?);(\w).*$|$1$2$3|  # 双拼+声调+1位辅助码
      - derive|^(.*?)(\d?);(\w).*$|$1$3$2|  # 双拼+1位辅助码+声调
      - abbrev/^(.*?)(\d?);(\w)(\w).*$/$1$3$4/  # 双拼+2位辅助码的情况
      - derive|^(.*?)(\d?);(\w)(\w).*$|$1$3$4$2| # 双拼+字母 字母 数字
      - derive|^(.*?)(\d?);(\w)(\w).*$|$1$2$3$4|  # 双拼+数字 字母 字母
      - derive|^(.*?)(\d?);(\w)(\w).*$|$1$3$2$4|  # 双拼+字母 数字 字母
      - derive|^(.*?)(\d?);(\w)(\w).*$|$1$3$4/| # 双拼+2位辅助码+/
      - derive|^(.*?)(\d?);(\w)(\w).*$|$1$3$4o| # 双拼\+2位辅助码\+o，主要用来应对小企鹅这类输入法没法使用符号的场景，但同时有些辅助码会出现异常，如：ui uio>uiuio，手机小企鹅使用时开启
  #分号后面第二组辅助码
      - derive/^(.*?)(\d?);.*?,(\w).*$/$1$3/        # 双拼+一位辅助码的情况
      - derive|^(.*?)(\d?);.*?,(\w).*$|$1$2$3|  # 双拼+声调+1位辅助码
      - derive|^(.*?)(\d?);.*?,(\w).*$|$1$3$2|  # 双拼+1位辅助码+声调
      - abbrev/^(.*?)(\d?);.*?,(\w)(\w).*$/$1$3$4/  # 双拼+2位辅助码的情况
      - derive|^(.*?)(\d?);.*?,(\w)(\w).*$|$1$3$4$2| # 双拼+字母 字母 数字
      - derive|^(.*?)(\d?);.*?,(\w)(\w).*$|$1$2$3$4|  # 双拼+数字 字母 字母
      - derive|^(.*?)(\d?);.*?,(\w)(\w).*$|$1$3$2$4|  # 双拼+字母 数字 字母
      - derive|^(.*?)(\d?);.*?,(\w)(\w).*$|$1$3$4/| # 双拼+2位辅助码+/
      - derive|^(.*?)(\d?);.*?,(\w)(\w).*$|$1$3$4o| # 双拼\+2位辅助码\+o，主要用来应对小企鹅这类输入法没法使用符号的场景，但同时有些辅助码会出现异常，如：ui uio>uiuio，手机小企鹅使用时开启
      - erase/^(.+);(.+)$/    # 删除原始编码加速检索
      - xform/◯/;/  #对于微软双拼、搜狗双拼，前面将分号保护了起来，现在放出来让其发挥作用
      - xlit/AEQWRTYUIOPSDFGHMJCKLZXVBN/aeqwrtyuiopsdfghmjcklzxvbn/
      # 变体1：转第5位大写 (ab1Cd)
      - derive|^(..)(\d)([a-z])([a-z]?)$|$1$2\u$3$4|
      # 变体2：转第5位大写 (ab1cD)
      - derive|^(..)(\d)([a-z])([a-z]?)$|$1$2$3\u$4|
      # 变体3：后两字母都转大写 (ab1CD)
      - derive|^(..)(\d)([a-z])([a-z]?)$|$1$2\u$3\u$4|
      # 变体1：转第3位大写 (abC1d)
      - derive|^(..)([a-z])(\d?)([a-z]?)$|$1\u$2$3$4|
      # 变体2：转第5位大写 (abc1D)
      - derive|^(..)([a-z])(\d?)([a-z]?)$|$1$2$3\u$4|
      # 变体3：两字母都转大写 (abC1D)
      - derive|^(..)([a-z])(\d?)([a-z]?)$|$1\u$2$3\u$4|
      # 变体1：转第3位大写 (abCd1)
      - derive|^(..)([a-z])([a-z])(\d?)$|$1\u$2$3$4|
      # 变体2：转第4位大写 (abcD1)
      - derive|^(..)([a-z])([a-z])(\d?)$|$1$2\u$3$4|
      # 变体3：两字母都转大写 (abCD1)
      - derive|^(..)([a-z])([a-z])(\d?)$|$1\u$2\u$3$4|


