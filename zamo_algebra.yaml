    - derive/1/'one'/
    - derive/10/'ten'/
    - derive/2/'to'/
    - derive/2/'two'/
    - derive/3/'three'/
    - derive/4/'for'/
    - derive/4/'four'/
    - derive/5/'five'/
    - derive/6/'six'/
    - derive/7/'seven'/
