name: Update dicts

# 每天自动拉取上游 wanxiang 夜间词库并同步到 dicts/。
# 上游：https://github.com/amzxyz/rime-wanxiang
# 资源：releases/download/dict-nightly/pro-moqi-fuzhu-dicts.zip

on:
  schedule:
    # GitHub cron 使用 UTC；19:30 UTC = 北京时间 03:30
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dicts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download nightly dicts
        env:
          DICT_URL: https://github.com/amzxyz/rime-wanxiang/releases/download/dict-nightly/pro-moqi-fuzhu-dicts.zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dicts"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            -o "$RUNNER_TEMP/dicts.zip" "$DICT_URL"
          unzip -o -q "$RUNNER_TEMP/dicts.zip" -d "$RUNNER_TEMP/dicts"
          ls -lh "$RUNNER_TEMP/dicts"

      - name: Sync into dicts/
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/dicts"
          # 上游文件名 -> 本库路径（仅同步本库已在使用的词库）
          declare -A MAP=(
            ["zi.pro.dict.yaml"]="dicts/zi.pro.dict.yaml"
            ["jichu.pro.dict.yaml"]="dicts/jichu.pro.dict.yaml"
            ["cuoyin.pro.dict.yaml"]="dicts/cuoyin.pro.dict.yaml"
            ["diming.pro.dict.yaml"]="dicts/diming.pro.dict.yaml"
            ["duoyin.pro.dict.yaml"]="dicts/duoyin.pro.dict.yaml"
            ["mingren.pro.dict.yaml"]="dicts/mingren.pro.dict.yaml"
            ["yiren.pro.dict.yaml"]="dicts/yiren.pro.dict.yaml"
            # 上游 mixed 即本库的 cn&en，仅词库名不同
            ["mixed.dict.yaml"]="dicts/cn&en.dict.yaml"
          )

          for name in "${!MAP[@]}"; do
            dest="${MAP[$name]}"
            if [[ ! -s "$src/$name" ]]; then
              echo "::error::上游压缩包缺少 $name"
              exit 1
            fi
            # 同步前的基本校验：必须是 Rime 词典
            head -n 20 "$src/$name" | grep -q '^name: ' || {
              echo "::error::$name 不是有效的 Rime 词典"; exit 1; }
            cp -f "$src/$name" "$dest"
            echo "updated $dest"
          done

          # cn&en 保留本库的词典名
          sed -i 's/^name: mixed$/name: cn\&en/' "dicts/cn&en.dict.yaml"
          grep -m1 '^name: ' "dicts/cn&en.dict.yaml"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dicts
          if git diff --cached --quiet; then
            echo "词库无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(dicts): 同步 wanxiang 夜间词库 $(date -u +%F)"
          git push
