# Rime schema settings
# encoding: utf-8
schema:
  schema_id: zamo_mixedcode
  name: "雑䁿：英文与混合编码"
  version: "LTS"
  author: amzxyz
  description: |
    混合编码负责将英文、中英文混合、携带符号的词组等全部统一到这个方案中完成
engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?


speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"
  algebra:
    __include: zamo_algebra:/mixed/通用派生规则
    __patch: zamo_algebra:/mixed/小鹤双拼
translator:
  dictionary: zamo_mixedcode
  enable_user_dict: false